services:
  - type: web
    name: agent-blogger-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: WP_URL
        value: https://lucasbenites.com
      - key: WP_USERNAME
        sync: false
      - key: WP_APP_PASSWORD
        sync: false
    autoDeploy: true
    branch: main
    healthCheckPath: /